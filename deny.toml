# cargo-deny policy. Run: cargo deny check
[graph]
all-features = true

[advisories]
# Any RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails CI.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# The allow-list is a policy, not an inventory: unused entries are fine.
unused-allowed-license = "allow"
# Permissive licences compatible with Apache-2.0 only. No copyleft.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots (Mozilla's CA list, via rustls for Gmail/IMAP): a permissive data licence.
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own unpublished crates have no version.
allow-wildcard-paths = true
# No OpenSSL anywhere in the tree (build plan §1: no C toolchain needed).
deny = [
    { crate = "openssl" },
    { crate = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
