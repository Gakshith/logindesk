[workspace]
resolver = "3"
members = ["crates/*", "testbed"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/Gakshith/logindesk"
publish = false

[workspace.dependencies]
# Exact pins (build plan §6). Change deliberately, with the full gate.
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

# testbed only (Phase 3). Never a dependency of crates/*.
axum = { version = "=0.8.9" }
tokio = { version = "=1.54.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
rand = { version = "=0.10.3" }
base64 = { version = "=0.23.1" }
hmac = { version = "=0.13.0" }
sha1 = { version = "=0.11.0" }
tempfile = { version = "=3.27.0" }
tower = { version = "=0.5.3" }
http-body-util = { version = "=0.1.5" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
debug = false
strip = true
