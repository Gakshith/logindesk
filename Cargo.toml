[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/Gakshith/logindesk"
publish = false

[workspace.dependencies]
# Exact pins (build plan §6). Change deliberately, with the full gate.
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
debug = false
strip = true
