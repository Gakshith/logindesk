name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing by default; each job asks for read-only contents.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_TOOLCHAIN: 1.97.1

jobs:
  rust:
    name: fmt · clippy · test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  guards:
    name: dependency and unsafe guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: logindesk-core never depends on serde
        run: |
          if cargo tree -p logindesk-core -e normal --locked --prefix none | grep -E '^serde'; then
            echo "::error::logindesk-core must not depend on serde (Secret<T> must stay unserializable)"
            exit 1
          fi
      - name: unsafe is forbidden outside crates/vault/src/hardening.rs
        run: |
          # Every crate except vault inherits workspace lints (unsafe_code = forbid).
          for f in crates/*/Cargo.toml testbed/Cargo.toml; do
            [ "$f" = crates/vault/Cargo.toml ] && continue
            grep -q '^workspace = true' "$f" || { echo "::error file=$f::must inherit [lints] workspace = true"; exit 1; }
          done
          grep -q '^unsafe_code = "deny"' crates/vault/Cargo.toml || { echo "::error::vault must deny unsafe_code"; exit 1; }
          # The only allow(unsafe_code) in the tree is the hardening module.
          hits=$(grep -rn --include='*.rs' 'allow(unsafe_code)' crates testbed | grep -v '^crates/vault/src/lib.rs:.*mod hardening' || true)
          if [ -n "$hits" ]; then echo "::error::unexpected allow(unsafe_code):"; echo "$hits"; exit 1; fi
          grep -n 'unsafe' crates/vault/src/*.rs | grep -v '^crates/vault/src/hardening.rs' | grep -v 'unsafe_code' && { echo "::error::unsafe outside hardening.rs"; exit 1; } || true

  supply-chain:
    name: cargo deny · cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: cargo deny
        run: cargo deny --locked check
      - name: cargo audit
        run: cargo audit --deny warnings

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified release binary)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
