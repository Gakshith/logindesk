[package]
name = "logindesk-mcp"
description = "logindesk MCP stdio server: a thin client of the daemon socket. Holds no secrets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No dependency on vault, executor or mail: this crate cannot reach a secret.
[dependencies]
logindesk-core = { path = "../core" }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std"] }

[lints]
workspace = true
