<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>logindesk spike</title></head>
<body>
<h1>Spike sign-in</h1>
<form>
  <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username">
  <label for="pw">Password</label><input id="pw" name="pw" type="password" autocomplete="current-password">
  <button type="button">Sign in</button>
</form>
<p>navigator.language: <span id="lang"></span></p>
<p>runtime probe: <span id="det">pending</span></p>
<script>
document.getElementById('lang').textContent = navigator.language + " / " + navigator.languages.join(",") + " / webdriver=" + navigator.webdriver;
// Classic CDP probe: the stack getter only runs if a DevTools client has Runtime/console enabled
// and serialises the console.debug argument.
let hits = 0;
setInterval(() => {
  const e = new Error();
  Object.defineProperty(e, 'stack', { get() { hits++; return ''; } });
  console.debug(e);
  document.getElementById('det').textContent = hits > 0 ? 'RUNTIME_DETECTED' : 'clean';
}, 200);
</script>
</body></html>
