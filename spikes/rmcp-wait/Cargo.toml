[package]
name = "rmcp-wait"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rmcp = { version = "3.9", features = ["server", "transport-io", "request-state", "macros"] }
schemars = "1.2.3"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
