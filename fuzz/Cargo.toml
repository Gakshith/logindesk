[package]
name = "logindesk-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
logindesk-vault = { path = "../crates/vault" }

# Its own workspace: needs nightly, never built by the main workspace or CI.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "vault_file"
path = "fuzz_targets/vault_file.rs"
test = false
doc = false
bench = false
